<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a74"/></marker>
    <marker id="ae" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a74"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="979" height="579" rx="14" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="40" y="36" font-size="19" font-weight="600" fill="#1a1a1a">PackTags · MVVM-C architecture</text>
  <text x="40" y="58" font-size="13" fill="#666">One feature slice: who creates what, who uses whom, and where data flows.</text>

  <rect x="70" y="78" width="840" height="40" rx="9" fill="#F1EFE8" stroke="#888780"/>
  <text x="490" y="96" text-anchor="middle" font-size="13.5" font-weight="600" fill="#23231f">AppDependencies · composition root</text>
  <text x="490" y="112" text-anchor="middle" font-size="12" fill="#5f5e5a">PersistenceController · Repository · AppSettings · InstagramGraph gateway</text>

  <rect x="60" y="170" width="176" height="58" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="148" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">Coordinator</text>
  <text x="148" y="214" text-anchor="middle" font-size="11.5" fill="#534AB7">builds screens · owns navigation</text>

  <rect x="286" y="170" width="164" height="58" rx="10" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="368" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">View</text>
  <text x="368" y="214" text-anchor="middle" font-size="11.5" fill="#185FA5">UIKit VC · SwiftUI</text>

  <rect x="500" y="170" width="180" height="58" rx="10" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="590" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">ViewModel</text>
  <text x="590" y="214" text-anchor="middle" font-size="11.5" fill="#185FA5">owns logic · state</text>

  <rect x="734" y="170" width="196" height="58" rx="10" fill="#F1EFE8" stroke="#888780"/>
  <text x="832" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#23231f">Model · value types</text>
  <text x="832" y="211" text-anchor="middle" font-size="11.5" fill="#5f5e5a">Theme · Profile · InstagramPost</text>

  <rect x="80" y="350" width="150" height="54" rx="10" fill="#EAF3DE" stroke="#639922"/>
  <text x="155" y="374" text-anchor="middle" font-size="13.5" font-weight="600" fill="#173404">Domain</text>
  <text x="155" y="391" text-anchor="middle" font-size="11.5" fill="#3B6D11">product rules</text>

  <rect x="330" y="350" width="150" height="54" rx="10" fill="#F1EFE8" stroke="#888780"/>
  <text x="405" y="381" text-anchor="middle" font-size="13" font-weight="600" fill="#23231f">Repository</text>

  <rect x="560" y="350" width="180" height="54" rx="10" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="650" y="381" text-anchor="middle" font-size="13" font-weight="600" fill="#04342C">InstagramGraph</text>

  <g fill="#F1EFE8" stroke="#888780">
    <path d="M327 430 A78 7 0 0 1 483 430 L483 470 A78 7 0 0 1 327 470 Z"/>
    <ellipse cx="405" cy="430" rx="78" ry="7" fill="#e8e6dd"/>
  </g>
  <text x="405" y="457" text-anchor="middle" font-size="12.5" font-weight="600" fill="#23231f">Core Data</text>

  <g fill="#E1F5EE" stroke="#1D9E75">
    <path d="M562 430 A88 7 0 0 1 738 430 L738 470 A88 7 0 0 1 562 470 Z"/>
    <ellipse cx="650" cy="430" rx="88" ry="7" fill="#d3efe4"/>
  </g>
  <text x="650" y="457" text-anchor="middle" font-size="12.5" font-weight="600" fill="#04342C">Meta Graph API</text>

  <g stroke="#7a7a74" stroke-width="1.6" fill="none">
    <path d="M148 118 L148 170" stroke-dasharray="5 4" marker-end="url(#ae)"/>
    <path d="M206 170 L206 144 L590 144 L590 170" stroke-dasharray="5 4" marker-end="url(#ae)"/>
    <path d="M236 199 L286 199" stroke-dasharray="5 4" marker-end="url(#ae)"/>
  </g>
  <g stroke="#7a7a74" stroke-width="1.6" fill="none">
    <path d="M560 170 L560 160 L162 160 L162 170" marker-end="url(#ae)"/>
    <path d="M450 192 L500 192" marker-end="url(#ae)"/>
    <path d="M500 206 L450 206" marker-end="url(#ae)"/>
    <path d="M680 199 L734 199" marker-end="url(#ae)"/>
    <path d="M545 228 L212 350" marker-end="url(#ae)"/>
    <path d="M576 228 L408 350" marker-end="url(#ae)"/>
    <path d="M616 228 L648 350" marker-end="url(#ae)"/>
    <path d="M405 404 L405 426" marker-end="url(#ae)"/>
    <path d="M650 404 L650 426" marker-end="url(#ae)"/>
  </g>
  <g font-size="11" fill="#777">
    <text x="156" y="146">injects</text>
    <text x="470" y="138">creates</text>
    <text x="246" y="194">creates</text>
    <text x="180" y="154">navigation intents</text>
    <text x="456" y="186">uses</text>
    <text x="456" y="220">state</text>
    <text x="686" y="192">holds / maps</text>
    <text x="330" y="286">applies rules</text>
    <text x="452" y="300">reads / writes</text>
    <text x="628" y="300">fetches</text>
    <text x="412" y="420">persists</text>
    <text x="658" y="420">HTTPS</text>
  </g>

  <text x="40" y="540" font-size="11.5" fill="#777">The coordinator creates the view and the view model, injects the view model into the view, and owns navigation; the view model signals navigation intents back to it.</text>
  <text x="40" y="558" font-size="11.5" fill="#999">The view only uses the view model. The view model holds/maps the model, applies domain rules, and calls the data layer, which returns the value models it holds.</text>
</svg>
