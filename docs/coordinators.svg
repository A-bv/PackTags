<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7a7a74"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="939" height="559" rx="14" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="40" y="42" font-size="19" font-weight="600" fill="#1a1a1a">Coordinator tree</text>
  <text x="40" y="64" font-size="13" fill="#666">Coordinators own every navigation decision; view controllers never present each other.</text>

  <!-- legend -->
  <rect x="636" y="30" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/><text x="656" y="42" font-size="11.5" fill="#555">coordinator</text>
  <rect x="730" y="30" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD"/><text x="750" y="42" font-size="11.5" fill="#555">UIKit</text>
  <rect x="800" y="30" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75"/><text x="820" y="42" font-size="11.5" fill="#555">SwiftUI</text>

  <!-- root -->
  <rect x="380" y="80" width="180" height="52" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="470" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">AppCoordinator</text>
  <text x="470" y="122" text-anchor="middle" font-size="11.5" fill="#534AB7">root · app lifetime</text>

  <!-- level 2: area coordinators -->
  <rect x="100" y="170" width="250" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="225" y="201" text-anchor="middle" font-size="13.5" font-weight="600" fill="#26215C">NotebookCoordinator</text>

  <rect x="590" y="170" width="280" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="730" y="201" text-anchor="middle" font-size="13.5" font-weight="600" fill="#26215C">ConnectedInsightsCoordinator</text>

  <g stroke="#7a7a74" stroke-width="1.6" fill="none">
    <path d="M425 132 C350 155, 290 150, 235 170" marker-end="url(#a)"/>
    <path d="M515 132 C600 155, 665 150, 715 170" marker-end="url(#a)"/>
  </g>

  <!-- notebook screens (UIKit) -->
  <g>
    <rect x="125" y="250" width="200" height="34" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="225" y="272" text-anchor="middle" font-size="12.5" fill="#042C53">ThemeList</text>
    <rect x="125" y="292" width="200" height="34" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="225" y="314" text-anchor="middle" font-size="12.5" fill="#042C53">PackList</text>
    <rect x="125" y="334" width="200" height="34" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="225" y="356" text-anchor="middle" font-size="12.5" fill="#042C53">ThemeEditor</text>
  </g>
  <g stroke="#cfcdc6" stroke-width="1.4" fill="none">
    <path d="M110 220 L110 351 L125 351"/>
    <path d="M110 267 L125 267"/><path d="M110 309 L125 309"/>
  </g>

  <!-- insights screens (SwiftUI) -->
  <g>
    <rect x="615" y="250" width="230" height="34" rx="8" fill="#E1F5EE" stroke="#1D9E75"/><text x="730" y="272" text-anchor="middle" font-size="12.5" fill="#04342C">SmartG</text>
    <rect x="615" y="292" width="230" height="34" rx="8" fill="#E1F5EE" stroke="#1D9E75"/><text x="730" y="314" text-anchor="middle" font-size="12.5" fill="#04342C">Analytics</text>
  </g>
  <g stroke="#cfcdc6" stroke-width="1.4" fill="none">
    <path d="M600 220 L600 309 L615 309"/>
    <path d="M600 267 L615 267"/>
  </g>

  <!-- level 3: child coordinators -->
  <rect x="60" y="400" width="200" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="160" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">SettingsCoordinator</text>

  <rect x="295" y="400" width="215" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="402" y="431" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">OnboardingCoordinator</text>

  <rect x="600" y="400" width="260" height="50" rx="10" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="730" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">FacebookLoginCoordinator</text>
  <text x="730" y="440" text-anchor="middle" font-size="10.5" fill="#534AB7">setup · ATT-aware login</text>

  <g stroke="#7a7a74" stroke-width="1.6" fill="none">
    <path d="M112 220 C72 280, 72 340, 125 400" marker-end="url(#a)"/>
    <path d="M300 220 C370 280, 395 330, 400 400" marker-end="url(#a)"/>
    <path d="M862 220 C902 270, 902 340, 852 400" marker-end="url(#a)"/>
    <!-- Settings can re-run the intro -->
    <path d="M260 425 L295 425" stroke-dasharray="5 4" marker-end="url(#a)"/>
  </g>

  <!-- settings screens (UIKit) -->
  <g>
    <rect x="75" y="470" width="170" height="32" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="160" y="491" text-anchor="middle" font-size="12.5" fill="#042C53">Settings</text>
    <rect x="75" y="506" width="170" height="32" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="160" y="527" text-anchor="middle" font-size="12.5" fill="#042C53">QuantityPicker</text>
  </g>
  <g stroke="#cfcdc6" stroke-width="1.4" fill="none">
    <path d="M64 450 L64 522 L75 522"/>
    <path d="M64 486 L75 486"/>
  </g>

  <!-- onboarding screen (UIKit) -->
  <rect x="310" y="470" width="185" height="32" rx="8" fill="#E6F1FB" stroke="#378ADD"/><text x="402" y="491" text-anchor="middle" font-size="12.5" fill="#042C53">Onboarding</text>
  <g stroke="#cfcdc6" stroke-width="1.4" fill="none">
    <path d="M299 450 L299 486 L310 486"/>
  </g>

  <!-- login screens (SwiftUI) -->
  <g>
    <rect x="615" y="470" width="230" height="32" rx="8" fill="#E1F5EE" stroke="#1D9E75"/><text x="730" y="491" text-anchor="middle" font-size="12.5" fill="#04342C">FacebookLoginView</text>
    <rect x="615" y="506" width="230" height="32" rx="8" fill="#E1F5EE" stroke="#1D9E75"/><text x="730" y="527" text-anchor="middle" font-size="12.5" fill="#04342C">SetupInfoView</text>
  </g>
  <g stroke="#cfcdc6" stroke-width="1.4" fill="none">
    <path d="M604 450 L604 522 L615 522"/>
    <path d="M604 486 L615 486"/>
  </g>
</svg>
